name: Import Commons Wallpapers

on:
  schedule:
    - cron: "31 2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "New wallpapers to import in this run (maximum 100)"
        required: false
        default: "50"
      queries:
        description: "Optional comma-separated Commons search terms (uses the built-in global collection when empty)"
        required: false
        default: ""
      category:
        description: "Category folder used with custom search terms"
        required: false
        default: "Nature"

permissions:
  contents: write

concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Import licensed, portrait images
        env:
          IMPORT_LIMIT: ${{ github.event.inputs.limit || '50' }}
          IMPORT_TARGET_TOTAL: "2000"
          IMPORT_QUERIES: ${{ github.event.inputs.queries || '' }}
          IMPORT_CATEGORY: ${{ github.event.inputs.category || 'Nature' }}
        run: npm run import-wallpapers
      - name: Generate thumbnails
        run: npm run generate-thumbnails
      - name: Generate catalog and tag index
        env:
          GITHUB_BRANCH: main
        run: npm run generate-images-json
      - name: Validate catalog contract
        run: npm run validate
      - name: Validate imported attribution
        run: npm run validate-imports
      - name: Commit additions directly to main
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add wallpapers/ thumbnails/ images.json tags-index.json imported.json
          if git diff --cached --quiet; then
            echo "No new eligible Commons wallpapers to commit."
          else
            git commit -m "Add licensed Wikimedia Commons wallpapers"
            git push origin HEAD:main
          fi
