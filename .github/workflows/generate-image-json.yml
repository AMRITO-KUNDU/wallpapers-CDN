name: Generate Wallpaper Data

on:
  push:
    paths:
      - "wallpapers/**"
      - "scripts/**"
      - "package.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate thumbnails
        run: npm run generate-thumbnails

      - name: Generate JSON
        run: |
          python3 << 'EOF'
          import os
          import json

          root = "wallpapers"
          repo = "${{ github.repository }}"
          branch = "main"

          result = []

          for category in sorted(os.listdir(root)):
              category_path = os.path.join(root, category)

              if not os.path.isdir(category_path):
                  continue

              base = f"https://cdn.jsdelivr.net/gh/{repo}@{branch}/{root}/{category}/"
              thumbnail_base = f"https://cdn.jsdelivr.net/gh/{repo}@{branch}/thumbnails/{category}/"

              files = []

              for f in sorted(os.listdir(category_path)):
                  if f.lower().endswith(
                      (".jpg", ".jpeg", ".png", ".webp")
                  ):
                      files.append({
                          "name": f,
                          "url": base + f,
                          "thumbnail": (
                              thumbnail_base
                              + os.path.splitext(f)[0]
                              + ".webp"
                          )
                      })

              if files:
                  result.append({
                      "category": category,
                      "files": files
                  })

          with open("images.json", "w") as out:
              json.dump(result, out, indent=2)

          print(
              "✔ Generated images.json with",
              len(result),
              "categories."
          )
          EOF

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add images.json
          git add thumbnails/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update wallpaper data"
            git push
          fi