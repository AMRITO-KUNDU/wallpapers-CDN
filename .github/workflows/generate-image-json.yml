name: Generate Wallpaper Data

on:
  push:
    paths:
      - "wallpapers/**"
      - "scripts/**"
      - "package.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate thumbnails
        run: npm run generate-thumbnails

      - name: Generate JSON
        run: npm run generate-images-json
        env:
          GITHUB_BRANCH: main

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add images.json
          git add thumbnails/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update wallpaper data"
            git push
          fi